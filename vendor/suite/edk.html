const REC = { stream: null, node: null, chunks: [], take: null, level: 0 };

REC.open = () => {
  if (UI.$('#recDlg')) return;
  const d = document.createElement('div'); d.className = 'dlg-back'; d.id = 'recDlg';
  d.innerHTML = `<div class="dlg rec" role="dialog" aria-label="Record a sample">
    <h3>Record a sample</h3>
    <canvas id="recWave" height="90"></canvas>
    <div class="recrow"><button class="tbtn rec" id="recGo" aria-label="Record">${UI.ICONS.rec}</button><span class="lcd" id="recTime">0.0 s</span>
      <label class="chk"><input type="checkbox" id="recBeat"> Play the beat while recording</label></div>
    <div class="recrow hidden" id="recAfter"><input id="recName" value="My sample" aria-label="Sample name"><button class="btn" id="recPlay">Play</button><button class="btn" id="recAgain">Retake</button></div>
    <p class="sub" id="recMsg">Tap the red button and make a sound: a clap, a voice, a pot lid. Silence at the start and end is trimmed.</p>
    <div class="dlg-btns"><button class="btn" id="recCancel">Cancel</button><button class="btn on" id="recAdd" disabled>Add to the rack</button></div></div>`;
  document.body.appendChild(d);
  UI.$('#recGo').onclick = () => (REC.node ? REC.stop() : REC.start());
  UI.$('#recCancel').onclick = REC.close;
  UI.$('#recAgain').onclick = () => { REC.take = null; UI.$('#recAfter').classList.add('hidden'); UI.$('#recAdd').disabled = true; REC.draw(); REC.start(); };
  UI.$('#recPlay').onclick = () => { if (REC.take) { const id = '_rec_preview'; ENG.userSamples.set(id, REC.take); A.eng.previewSound(id); } };
  UI.$('#recAdd').onclick = () => {
    if (!REC.take) return;
    const id = U.uid('s'); ENG.userSamples.set(id, Object.assign({}, REC.take, { name: (UI.$('#recName').value || 'My sample').slice(0, 40) }));
    ENG.userSamples.delete('_rec_preview'); A.storeSample(id); A.addSoundChannel(id, true); BROWSER.render(); REC.close();
  };
  REC.draw();
};
REC.close = () => { REC.stopStream(); ENG.userSamples.delete('_rec_preview'); const d = UI.$('#recDlg'); if (d) d.remove(); if (A.eng.playing) A.stop(); };
REC.stopStream = () => { if (REC.stream) REC.stream.getTracks().forEach((t) => t.stop()); REC.stream = null; if (REC.node) { try { REC.node.disconnect(); } catch (e) { /* */ } } REC.node = null; };

REC.start = async () => {
  const msg = UI.$('#recMsg');
  try {
    await A.eng.resume();
    REC.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  } catch (e) {
    msg.textContent = 'The microphone is not available here (' + (e.name || e.message) + '). In the Android app allow the microphone when asked; in a browser use the app\'s own page or the local launcher.';
    return;
  }
  const ctx = A.eng.ctx, src = ctx.createMediaStreamSource(REC.stream);
  const node = new AudioWorkletNode(ctx, 'ds-rec', { numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [1], channelCount: 2, channelCountMode: 'explicit' });
  const sink = ctx.createGain(); sink.gain.value = 0; src.connect(node); node.connect(sink); sink.connect(ctx.destination);
  REC.node = node; REC.chunks = []; REC.t0 = ctx.currentTime;
  node.port.onmessage = (e) => {
    const m = e.data;
    if (m.t === 'lvl') REC.level = Math.max(...m.pk);
    else if (m.t === 'chunk') { REC.chunks.push(m.ch); REC.draw(); }
    else if (m.t === 'stopped') REC.finish();
  };
  node.port.postMessage({ type: 'start', at: Math.round(ctx.currentTime * ctx.sampleRate) });
  if (UI.$('#recBeat').checked && !A.eng.playing) A.play();
  UI.$('#recGo').classList.add('on'); UI.$('#recGo').innerHTML = UI.ICONS.stop; msg.textContent = 'Recording… tap again to stop.';
  const tick = () => { if (!REC.node) return; UI.$('#recTime').textContent = (ctx.currentTime - REC.t0).toFixed(1) + ' s'; REC.draw(); requestAnimationFrame(tick); };
  tick();
  REC.limit = setTimeout(() => { if (REC.node) REC.stop(); }, 60000); // one minute per take
};
REC.stop = () => { clearTimeout(REC.limit); if (REC.node) REC.node.port.postMessage({ type: 'stop' }); if (A.eng.playing) A.stop(); };
REC.finish = () => {
  REC.stopStream();
  UI.$('#recGo').classList.remove('on'); UI.$('#recGo').innerHTML = UI.ICONS.rec;
  const nch = REC.chunks.length ? REC.chunks[0].length : 0;
  const len = REC.chunks.reduce((a, c) => a + c[0].length, 0);
  if (!len) { UI.$('#recMsg').textContent = 'Nothing was recorded. Try again.'; return; }
  const ch = Array.from({ length: Math.min(2, nch) }, () => new Float32Array(len));
  let o = 0; for (const c of REC.chunks) { for (let k = 0; k < ch.length; k++) ch[k].set(c[k], o); o += c[0].length; }
  const take = SMP.trim({ ch, sr: A.eng.sr }, -42);
  if (!take) { UI.$('#recMsg').textContent = 'That was silent. Check the microphone and try again.'; return; }
  REC.take = SMP.normalize(take);
  UI.$('#recAfter').classList.remove('hidden'); UI.$('#recAdd').disabled = false;
  UI.$('#recMsg').textContent = 'Trimmed to ' + (REC.take.ch[0].length / REC.take.sr).toFixed(2) + ' s and levelled. Name it and add it, or retake.';
  REC.draw();
};
REC.draw = () => {
  const cv = UI.$('#recWave'); if (!cv) return;
  const w = cv.clientWidth || 300, h = 90, dpr = devicePixelRatio || 1; if (cv.width !== w * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.fillStyle = '#0d0705'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#3a2619'; g.beginPath(); g.moveTo(0, h / 2); g.lineTo(w, h / 2); g.stroke();
  const d = REC.take ? REC.take.ch[0] : REC.chunks.length ? REC.chunks.map((c) => c[0]) : null;
  if (!d) { // idle: live level bar
    g.fillStyle = '#d99a2b'; g.fillRect(0, h - 6, w * Math.min(1, REC.level * 1.4), 6); REC.level *= 0.9; return;
  }
  const flat = Array.isArray(d) ? (() => { const n = d.reduce((a, c) => a + c.length, 0), f = new Float32Array(n); let o = 0; d.forEach((c) => { f.set(c, o); o += c.length; }); return f; })() : d;
  const per = Math.max(1, Math.floor(flat.length / w)); g.fillStyle = REC.take ? '#f0c46a' : '#c4382a';
  for (let x = 0; x < w && x * per < flat.length; x++) { let m = 0; for (let i = x * per; i < Math.min(flat.length, (x + 1) * per); i++) m = Math.max(m, Math.abs(flat[i])); const y = m * h * 0.48; g.fillRect(x, h / 2 - y, 1, Math.max(1, y * 2)); }
};

// ---------------- sample tools ----------------
const SMP = {};
SMP.copy = (s) => ({ ch: s.ch.map((c) => new Float32Array(c)), sr: s.sr, name: s.name });
SMP.peak = (s) => { let m = 0; for (const c of s.ch) for (let i = 0; i < c.length; i++) { const a = Math.abs(c[i]); if (a > m) m = a; } return m; };
// cut silence below `db` (relative to the peak) off both ends, keeping 5 ms before and a 40 ms tail, with short fades
SMP.trim = (s, db) => {
  const pk = SMP.peak(s); if (pk < 0.002) return null;
  const thr = pk * Math.pow(10, db / 20), L = s.ch[0], n = L.length, hot = (i) => s.ch.some((c) => Math.abs(c[i]) > thr);
  let a = 0; while (a < n && !hot(a)) a++;
  let z = n - 1; while (z > a && !hot(z)) z--;
  a = Math.max(0, a - Math.round(s.sr * 0.005)); z = Math.min(n, z + Math.round(s.sr * 0.04));
  const out = { ch: s.ch.map((c) => c.slice(a, z)), sr: s.sr, name: s.name };
  const fi = Math.min(out.ch[0].length, Math.round(s.sr * 0.002)), fo = Math.min(out.ch[0].length, Math.round(s.sr * 0.015));
  for (const c of out.ch) { for (let i = 0; i < fi; i++) c[i] *= i / fi; for (let i = 0; i < fo; i++) c[c.length - 1 - i] *= i / fo; }
  return out;
};
SMP.normalize = (s) => { const pk = SMP.peak(s); if (!pk) return s; const g = Math.pow(10, -1 / 20) / pk, out = SMP.copy(s); for (const c of out.ch) for (let i = 0; i < c.length; i++) c[i] *= g; return out; };
SMP.reverse = (s) => { const out = SMP.copy(s); for (const c of out.ch) c.reverse(); return out; };
// a channel's current sample (factory or user) as an editable user sample, then swap the channel onto the edited copy
SMP.edit = (ch, fn, suffix) => {
  const src = ENG.sampleFor(ch); if (!src) return;
  const base = Object.assign({ name: ch.name }, src), out = fn(SMP.copy(base));
  const id = U.uid('s'); out.name = (ch.name + ' ' + suffix).slice(0, 40); ENG.userSamples.set(id, out); A.storeSample(id);
  const keep = Object.assign({}, ch.p); ch.sample = id; ch.sound = null; ch.p = keep; ch.name = out.name;
  A.change('smpedit', { rack: true }); BROWSER.render(); PANEL.open(ch.id); A.eng.preview(ch.id, ch.note || 60, M.DEF_VEL);
};
// stretch-by-pitch so the sample lasts exactly `bars` bars at the project tempo when played on the channel's home note
SMP.fit = (ch, bars) => {
  const src = ENG.sampleFor(ch); if (!src) return;
  const dur = src.ch[0].length / src.sr, target = bars * 16 * ENG.stepDur(A.proj.bpm);
  ch.p.root = ch.note || 60; ch.p.tune = Math.round(1200 * Math.log2(dur / target)); ch.p.oneshot = true; ch.p.loop = false; ch.p.track = true;
  A.change('fit', { panel: true });
  UI.toast(`Fitted to ${bars} bar${bars > 1 ? 's' : ''} at ${A.proj.bpm} BPM (${ch.p.tune > 0 ? '+' : ''}${(ch.p.tune / 100).toFixed(2)} st)`);
};

// Inside DAWters and Son as a Beat track: the host gives us its audio context, our output and its tempo,

// every edit ends here: sound follows the model, history records it, the touched views redraw
A.change = (key, o) => {
  o = o || {};

  A.hist.commit(A.proj, key);
  A.save();
  if (o.rack) RACK.render();

  if (o.panel && PANEL.id) PANEL.open(PANEL.id);
};
A.saveNow = () => { if (HOST) { if (HOST.changed) HOST.changed(); return; } try { localStorage.setItem(AUTOSAVE, JSON.stringify(A.proj)); } catch (e) { /* storage full or blocked */ } };
A.save = U.debounce(A.saveNow, 400);
// hand a file to the person: a download in browsers, Music/Esperanza's Drum Kit/ on Android (WebView has no downloads)
A.deliver = async (blob, name) => {
  // 1) Android app: chunked writes into Music/Esperanza's Drum Kit/ (WebView has no downloads)
  const br = window.EdkAndroid;
  if (br) {
    const u8 = new Uint8Array(await blob.arrayBuffer()), id = br.begin(name);
    if (id < 0) { UI.toast('Could not save ' + name); return; }
    const CH = 3 * 65536;
    for (let i = 0; i < u8.length; i += CH) { let s = ''; const part = u8.subarray(i, i + CH); for (let j = 0; j < part.length; j += 8192) s += String.fromCharCode.apply(null, part.subarray(j, j + 8192)); br.append(id, btoa(s)); }
    const path = br.finish(id); UI.toast(path ? 'Saved to Music/Esperanza\'s Drum Kit' : 'Could not save ' + name, 3000);
    return;
  }
  // 2) published Claude page: the downloads capability takes a short list of types, so audio and projects travel in a .zip
  const dl = window.claude && window.claude.use ? await window.claude.use('downloads').catch(() => null) : null;
  if (dl) {
    let fname = name, data = blob;
    if (!/\.(zip|json|txt|html|csv)$/i.test(name)) { fname = name + '.zip'; data = U.zip([{ name, data: new Uint8Array(await blob.arrayBuffer()) }]); }
    try { await dl.save({ filename: fname, data }); UI.toast('Saved ' + fname, 2500); }
    catch (e) { if (e && e.code !== 'declined') UI.toast('Saving is not available here: ' + (e.message || e.code)); }
    return;
  }
  // 3) any browser
  U.download(blob, name);
};
A.load = (proj) => {
  A.eng.stop();
  A.proj = M.migrate(proj); A.eng.sync(A.proj); A.hist.reset(A.proj);
  PANEL.close(); A.renderAll(); A.save();
};
A.renderAll = () => { A.updateTop(); RACK.render(); PL.render(); BROWSER.render(); };
A.undo = () => { const p = A.hist.undo(); if (p) { A.proj = M.migrate(p); A.eng.sync(A.proj); A.save(); A.renderAll(); if (PANEL.id) PANEL.open(PANEL.id); } };
A.redo = () => { const p = A.hist.redo(); if (p) { A.proj = M.migrate(p); A.eng.sync(A.proj); A.save(); A.renderAll(); if (PANEL.id) PANEL.open(PANEL.id); } };

// ---------------- channels ----------------
A.addSoundChannel = (sid, select) => {
  const p = A.proj, s = SOUND.byId(sid), user = ENG.userSamples.get(sid);
  const name = s ? (s.kind === 'drum' ? s.name : s.name) : user ? user.name : 'Sampler';
  const ch = M.newChannel(p, user ? { name, sample: sid, sound: null, p: SOUND.samplerParams(null), note: 60 } : { name, sound: sid, p: SOUND.samplerParams(sid), note: M.homeNote('sampler', sid) });
  p.channels.push(ch); if (select) p.sel = ch.id;
  A.change('addch', { rack: true });
  return ch;
};
A.addSynthChannel = (i) => {
  const p = A.proj, [name, params, note] = SOUND.SYNTHS[i];
  const ch = M.newChannel(p, { name, type: 'synth', sound: null, p: JSON.parse(JSON.stringify(params)), preset: i, note });
  p.channels.push(ch); p.sel = ch.id; A.change('addch', { rack: true });
  return ch;
};
A.setSound = (ch, sid) => {
  const user = ENG.userSamples.get(sid);
  if (ch.type !== 'sampler') { ch.type = 'sampler'; ch.p = SOUND.samplerParams(sid); }
  if (user) { ch.sample = sid; ch.sound = null; ch.p = Object.assign(ch.p, { root: 60, tune: 0 }); ch.name = user.name; }
  else { const keep = { a: ch.p.a, cut: ch.p.cut, res: ch.p.res }; ch.sample = null; ch.sound = sid; ch.p = Object.assign(SOUND.samplerParams(sid), keep); const s = SOUND.byId(sid); if (s) ch.name = s.name; ch.note = M.homeNote('sampler', sid); }
  A.change('sound', { rack: true });
  A.eng.preview(ch.id, ch.note || 60, M.DEF_VEL);
};
// decode a dropped or picked audio file into a user sample (kept in IndexedDB so autosave can bring it back)
A.loadSampleFile = async (file, target) => {
  try {
    const ab = await A.eng.ctx.decodeAudioData(await file.arrayBuffer());
    const ch = []; for (let c = 0; c < Math.min(2, ab.numberOfChannels); c++) ch.push(new Float32Array(ab.getChannelData(c)));
    const id = U.uid('s'), name = file.name.replace(/\.[^.]+$/, '').slice(0, 40);
    ENG.userSamples.set(id, { ch, sr: ab.sampleRate, name });
    A.storeSample(id);
    if (target) A.setSound(target, id); else A.addSoundChannel(id, true);
    BROWSER.render();
  } catch (e) { UI.toast('Could not read ' + file.name); }
};
A.storeSample = (id) => { if (HOST) return; const s = ENG.userSamples.get(id); if (s) U.idb.put('buffers', id, { ch: s.ch, sr: s.sr, name: s.name }).catch(() => {}); };
A.restoreSamples = async (proj) => {
  for (const ch of proj.channels) if (ch.sample && !ENG.userSamples.has(ch.sample)) {
    try { const s = await U.idb.get('buffers', ch.sample); if (s) ENG.userSamples.set(ch.sample, s); } catch (e) { /* missing */ }
  }
};

A.newPattern = () => { const pt = M.newPattern(A.proj); A.proj.patterns.push(pt); A.setPattern(pt.id); };
A.patMenu = (x, y) => {

// ---------------- transport ----------------
A.togglePlay = () => { if (A.eng.playing) A.stop(); else A.play(); };
A.play = () => {
  const p = A.proj; let from = 0;
  if (p.mode === 'song') { from = PL.songPos; const lp = p.loop; if (lp.on && (from < lp.start || from >= lp.start + lp.len)) from = lp.start; }
  A.eng.play(from); A.updateTop();
};
A.stop = () => { A.eng.stop(); RACK.showNow(-1); PL.showHead(null); A.updateTop(); A.showTime(null); };

A.setTempo = (bpm, done) => { bpm = Math.round(U.clamp(bpm, 10, 522) * 1000) / 1000; A.eng.retempo(bpm); A.proj.bpm = bpm; UI.$('#tempo span').textContent = bpm.toFixed(3); A.change('bpm', { quiet: !done }); if (HOST && done && HOST.tempo) HOST.tempo(bpm); };
A.showTime = (pos) => {
  const el = UI.$('#time'); if (!el) return;

  if (A.proj.mode === 'pat') pos = pos % M.pat(A.proj).len; else pos = ENG.songPos(A.proj, Math.floor(pos));
  const k = Math.max(0, Math.floor(pos));
  el.lastChild.textContent = `${Math.floor(k / 16) + 1}:${String(Math.floor(k / 4) % 4 + 1)}:${String(k % 4 + 1)}`;
};
A.frame = () => {
  const pos = A.eng.pos();
  if (pos !== null && pos >= 0) {
    const p = A.proj, k = Math.floor(pos);
    let col = -1;
    if (p.mode === 'pat') col = k % M.pat(p).len;
    else { const sl = ENG.slicesAt(p, k, 'song').find((x) => x.pat.id === p.cur); col = sl ? sl.ps : -1; }
    RACK.showNow(col); PL.showHead(pos); A.showTime(pos);
  }

};
A.meterHold = [0, 0];
A.drawMeter = () => {
  const cv = UI.$('#meter'); if (!cv || !cv.offsetParent) return;
  const dpr = devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  const pk = A.eng.peak();
  for (let i = 0; i < 2; i++) {
    A.meterHold[i] = Math.max(pk[i], A.meterHold[i] * 0.92);
    const db = 20 * Math.log10(A.meterHold[i] + 1e-9), n = U.clamp((db + 48) / 48, 0, 1);
    const y = 5 + i * 11, ww = (w - 8) * n, red = (w - 8) * (42 / 48);
    g.fillStyle = 'rgba(26,22,17,0.12)'; g.fillRect(4, y, w - 8, 8);
    g.fillStyle = '#1a1611'; g.fillRect(4, y, Math.min(ww, red), 8);
    if (ww > red) { g.fillStyle = '#c8231b'; g.fillRect(4 + red, y, ww - red, 8); }
  }
};

// ---------------- files ----------------
A.fileName = () => (A.proj.name || 'Untitled').replace(/[^\w\- ]+/g, '').trim() || 'Untitled';
A.saveFile = () => {
  const files = [{ name: 'project.json', data: new TextEncoder().encode(JSON.stringify(A.proj)) }];
  const used = new Set(A.proj.channels.map((c) => c.sample).filter(Boolean));
  for (const id of used) { const s = ENG.userSamples.get(id); if (s) files.push({ name: 'samples/' + id + '.wav', data: U.encodeWav(s.ch, s.sr, 32) }); files.push({ name: 'samples/' + id + '.txt', data: new TextEncoder().encode(s ? s.name : id) }); }
  A.deliver(U.zip(files), A.fileName() + '.edk');
};
A.openFile = async () => {
  const [f] = await U.pickFile('.edk,.zip,application/zip'); if (!f) return;
  try {

// scope: 'song' | 'pat' | 'section' (with sec); fmt: 'wav' (24-bit) | 'mp3' (320 kbps)
A.exportAudio = async (scope, fmt, sec) => {
  const p = A.proj;
  if (scope === 'song' && !p.playlist.clips.length) { UI.toast('The playlist is empty: place a pattern first, or export the pattern'); return; }
  UI.toast('Rendering…', 1500);
  const opts = { sr: A.eng.sr, tail: 1.5 };
  if (scope === 'section') { opts.range = { start: sec.start, len: sec.len }; opts.tail = 0.5; } else opts.mode = scope;
  const { buf } = await ENG.render(p, opts);
  const ch = [buf.getChannelData(0), buf.getChannelData(1)];
  const name = A.fileName() + (scope === 'pat' ? ' - ' + M.pat(p).name : scope === 'section' ? ' - ' + sec.name : '');
  if (fmt === 'mp3') A.deliver(await A.encodeMp3(ch, buf.sampleRate, 320), name + '.mp3');
  else A.deliver(new Blob([U.encodeWav(ch, buf.sampleRate, 24)], { type: 'audio/wav' }), name + '.wav');

A.exportWav = (mode) => A.exportAudio(mode, 'wav');
// MP3 with the bundled LAME port (lamejs, LGPL); encoded in slices so the screen stays responsive
A.encodeMp3 = async (ch, sr, kbps) => {
  if (typeof lamejs === 'undefined') throw new Error('MP3 encoder missing');
  const rate = [48000, 44100, 32000].includes(sr) ? sr : 44100;
  if (rate !== sr) { // resample to a rate MP3 supports
    const oc = new OfflineAudioContext(2, Math.ceil(ch[0].length * rate / sr), rate), b = oc.createBuffer(2, ch[0].length, sr);
    b.copyToChannel(ch[0], 0); b.copyToChannel(ch[1], 1); const src = oc.createBufferSource(); src.buffer = b; src.connect(oc.destination); src.start();
    const r = await oc.startRendering(); ch = [r.getChannelData(0), r.getChannelData(1)];
  }
  const enc = new lamejs.Mp3Encoder(2, rate, kbps), n = ch[0].length, parts = [], B = 1152;
  const toI16 = (f, a, z) => { const o = new Int16Array(z - a); for (let i = a; i < z; i++) { const v = Math.max(-1, Math.min(1, f[i])); o[i - a] = v < 0 ? v * 32768 : v * 32767; } return o; };
  for (let i = 0; i < n; i += B * 200) {
    const z = Math.min(n, i + B * 200), L = toI16(ch[0], i, z), R = toI16(ch[1], i, z);
    for (let j = 0; j < L.length; j += B) { const d = enc.encodeBuffer(L.subarray(j, j + B), R.subarray(j, j + B)); if (d.length) parts.push(new Uint8Array(d)); }
    await new Promise((r) => setTimeout(r, 0));
  }
  const tail = enc.flush(); if (tail.length) parts.push(new Uint8Array(tail));
  return new Blob(parts, { type: 'audio/mpeg' });
};
A.demo = (quiet) => {

  const on = (ch, steps, v) => steps.forEach((s) => M.setCell(pat, ch.id, s, { v: v || M.DEF_VEL, n: 60, g: 1 }));
  on(kick, [0, 7, 10]); on(clap, [4, 12]); on(hat, [0, 2, 4, 6, 8, 10, 12, 14]); on(hat, [3, 11], 0.45); on(snare, [15], 0.5);

// ---------------- Send to DAWters ----------------
// On the web: opens DAWters (or the tab it opened before) and hands it the beat once it says it's ready.
// In the Android app, or if DAWters doesn't answer: saves a .dawsuite.json file for DAWters' File → Import.
A.DAW_URL = 'https://dawters-and-son.github.io/dawters-and-son/app/';
A.sendToDAW = (payload) => {
  payload = Object.assign({ type: 'dawters-send', v: 1, from: 'edk' }, payload);
  const fname = (String(payload.name || 'Beat').replace(/[^\w\- ]+/g, '').trim() || 'Beat') + '.dawsuite.json';
  const file = () => A.deliver(new Blob([JSON.stringify(payload)], { type: 'application/json' }), fname).then(() => UI.toast('In DAWters: File → Import from the suite, and pick ' + fname, 5000));

  const origin = new URL(A.DAW_URL).origin, w = window.open(A.DAW_URL + '#receive', 'dawters');
  if (!w) return file();
  let done = false;
  const on = (e) => {
    if (e.source !== w || e.origin !== origin) return;
    if (e.data === 'dawters-ready') w.postMessage(payload, origin);
    else if (e.data && e.data.type === 'dawters-got') { done = true; window.removeEventListener('message', on); UI.toast(e.data.ok ? 'Sent to DAWters — it\'s on a new Beat track' : 'DAWters could not take that beat', 3500); }
  };
  window.addEventListener('message', on);
  UI.toast('Opening DAWters…', 2000);
  setTimeout(() => { if (done) return; window.removeEventListener('message', on); UI.toast('DAWters did not answer, so here is a file to import instead', 4000); file(); }, 45000);
};
A.sendBeat = () => A.sendToDAW({ kind: 'edk', name: A.proj.name && A.proj.name !== 'Untitled' ? A.proj.name : 'Beat', state: { app: 'edk', v: 1, proj: JSON.parse(JSON.stringify(A.proj)), samples: A.packSamples() } });
A.fileMenu = (x, y) => UI.menu(x, y, [
  ['New project', async () => { if (await UI.confirm('Start a new project?', 'Anything not saved to a file in this one will be lost.', 'Start new')) A.load(M.newProject()); }],
  ['Open…', A.openFile], ['Save as .edk', A.saveFile],
  ...(HOST ? [] : [['Send to DAWters (new Beat track)', A.sendBeat]]),
  'hr',
  ['Export song as WAV', () => A.exportAudio('song', 'wav')], ['Export song as MP3', () => A.exportAudio('song', 'mp3')],
  ['Export pattern as WAV', () => A.exportAudio('pat', 'wav')], ['Export pattern as MP3', () => A.exportAudio('pat', 'mp3')],
  'hr',
  ['Load the demo beat', async () => { if (await UI.confirm('Load the demo beat?', 'It replaces the project you have open.', 'Load demo')) A.demo(); }],
  ['Rename project…', async () => { const n = await UI.ask('Project name', A.proj.name); if (n) { A.proj.name = n.slice(0, 60); A.change('pname'); } }],
  [document.body.classList.contains('flat') ? 'Turn TV texture on' : 'Turn TV texture off', () => { document.body.classList.toggle('flat'); try { localStorage.setItem('edk.flat', document.body.classList.contains('flat') ? '1' : ''); } catch (e) { /* */ } }],
  ['About', A.about],
]);
A.about = () => UI.menu(innerWidth / 2 - 150, 120, [[`Esperanza's Drum Kit ${M.VERSION} · free software (GPL-3.0-or-later) · no tracking, no network`, () => {}], ['A DAWters and Son studio · fonts: Yesteryear, Oswald, Courier Prime, Alfa Slab One (SIL OFL 1.1)', () => {}]]);

// desktop: show/hide windows; phone: one view at a time from the bottom tabs
A.toggleWin = (w) => { if (innerWidth <= 760) { A.view(w === 'browser' ? 'sounds' : w); return; } document.body.classList.toggle('hide-' + w); A.syncViewBtns(); };
A.syncViewBtns = () => { [['vBrowser', 'browser'], ['vRack', 'rack'], ['vPl', 'playlist']].forEach(([b, w]) => UI.$('#' + b).classList.toggle('on', !document.body.classList.contains('hide-' + w))); };
A.view = (v) => { document.body.classList.remove('v-sounds', 'v-rack', 'v-playlist'); document.body.classList.add('v-' + v); UI.$$('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.v === v)); if (v === 'playlist') PL.render(); };

A.keys = (e) => {
  if (e.target.closest('input, select, textarea') || UI.$('.dlg-back')) return;
  const mod = e.ctrlKey || e.metaKey;
  if (e.code === 'Space') { e.preventDefault(); A.togglePlay(); }
  else if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); if (e.shiftKey) A.redo(); else A.undo(); }
  else if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); A.redo(); }
  else if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); A.saveFile(); }
  else if (mod && e.key.toLowerCase() === 'o') { e.preventDefault(); A.openFile(); }
  else if (!mod && e.key.toLowerCase() === 'l') A.setMode(A.proj.mode === 'pat' ? 'song' : 'pat');
  else if (e.key === 'F6') { e.preventDefault(); A.toggleWin('rack'); }
  else if (e.key === 'F5') { e.preventDefault(); A.toggleWin('playlist'); }
  else if (e.key === 'F8' && e.altKey) { e.preventDefault(); A.toggleWin('browser'); }
  else if (e.code === 'NumpadAdd' || (e.key === ']' && !mod)) A.stepPattern(1);
  else if (e.code === 'NumpadSubtract' || (e.key === '[' && !mod)) A.stepPattern(-1);
  else if (e.key === 'Escape') { UI.closeMenu(); PANEL.close(); }
};

// ---------------- boot ----------------
A.boot = async () => {
  UI.initKnobs();
  try { if (localStorage.getItem('edk.flat')) document.body.classList.add('flat'); } catch (e) { /* */ }
  A.eng = new ENG.Engine();
  await A.eng.init();
  await SOUND.render(A.eng.sr);
  let proj = null;
  if (HOST) { if (HOST.state) { A.unpackSamples(HOST.state.samples); proj = M.migrate(HOST.state.proj); } if (!proj) { A.demo(true); proj = A.proj; } proj.bpm = HOST.bpm(); }
  else try { const s = localStorage.getItem(AUTOSAVE); if (s) proj = JSON.parse(s); } catch (e) { proj = null; }
  if (proj && !HOST) { try { await A.restoreSamples(proj); proj = M.migrate(proj); } catch (e) { proj = null; } }
  A.proj = proj || M.newProject();
  A.eng.sync(A.proj); A.hist.reset(A.proj);
  A.eng.onPos = () => {};
  A.buildTop(); RACK.init(); PL.init(); BROWSER.init();
  A.renderAll(); A.syncViewBtns(); A.view('rack');
  UI.$$('#tabs button').forEach((b) => (b.onclick = () => A.view(b.dataset.v)));
  document.addEventListener('keydown', A.keys);
  addEventListener('resize', U.debounce(() => PL.render(), 200));
  requestAnimationFrame(A.frame);
  window.EDK = A; // handle for tests and the console
  if (HOST) { UI.$('#splash').remove(); A.pluginReady(); return; }
  const sp = UI.$('#splash'); UI.$('#splashGo').disabled = false; UI.$('#splashGo').textContent = 'Start';
  const go = () => { A.eng.resume(); sp.classList.add('gone'); setTimeout(() => sp.remove(), 450); };
  UI.$('#splashGo').onclick = go;
  if (/[?&]nosplash/.test(location.search)) go();
};
A.bootFail = (e) => {
  console.error(e);
  const sp = UI.$('#splash'); if (!sp) return;
  const fileOpen = location.protocol === 'file:' || location.origin === 'null';
  sp.querySelector('p').textContent = fileOpen
    ? 'This browser will not start the audio engine from a file opened directly. Open the app from its web link, run the "Start" launcher in the web folder, or use Chrome or Edge.'
    : 'The audio engine could not start in this browser (' + (e && e.message ? e.message : e) + '). Try a current Chrome, Edge, Firefox or Safari.';
  const g = UI.$('#splashGo'); if (g) { g.textContent = 'Audio unavailable'; g.disabled = true; }
};
// ---------------- plugin API (DAWters and Son) ----------------
const f32b64 = (f) => { const u = new Uint8Array(f.buffer, f.byteOffset, f.byteLength); let s = ''; for (let i = 0; i < u.length; i += 32768) s += String.fromCharCode.apply(null, u.subarray(i, i + 32768)); return btoa(s); };
const b64f32 = (s) => { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new Float32Array(u.buffer); };
A.packSamples = () => { const o = {}; for (const c of A.proj.channels) { const s = c.sample && ENG.userSamples.get(c.sample); if (s && !o[c.sample]) o[c.sample] = { sr: s.sr, name: s.name, ch: s.ch.map(f32b64) }; } return o; };
A.unpackSamples = (o) => { for (const id in o || {}) ENG.userSamples.set(id, { sr: o[id].sr, name: o[id].name, ch: o[id].ch.map(b64f32) }); };
A.pluginReady = () => {
  const api = window.SUITE_PLUGIN = {
    getState: () => ({ app: 'edk', v: 1, proj: JSON.parse(JSON.stringify(A.proj)), samples: A.packSamples() }),
    setState: (st) => { if (!st || !st.proj) return; A.unpackSamples(st.samples); const p = M.migrate(JSON.parse(JSON.stringify(st.proj))); p.bpm = HOST.bpm(); A.load(p); },
    // the host's look-ahead: our notes for its song time [a, b), starting at its context time ca
    window: (clips, a, b, ca) => {
      if (A.eng.playing) A.stop(); // our own preview gives way to the host's transport
      A.proj.bpm = HOST.bpm();
      const ev = ENG.hostEvents(A.proj, clips, a, b, ca, A.eng.sr);
      for (const [id, list] of ev) A.eng.graph.post(id, { t: 'ev', ev: list });
    },
    clear: () => { A.eng.graph.all({ t: 'clear' }); },
    render: (octx, o) => ENG.renderHost(Object.assign({}, A.proj, { bpm: HOST.bpm(), loop: Object.assign({}, A.proj.loop, { on: false }) }), octx, o.output, o.clips, o.s, o.e),
    bpm: (v) => { A.eng.retempo(v); A.proj.bpm = v; A.updateTop(); },
    info: () => ({ name: A.proj.name, songLen: M.songLen(A.proj), patterns: A.proj.patterns.map((p) => ({ id: p.id, name: p.name, color: p.color, len: p.len })),
      sections: (A.proj.sections || []).map((s) => ({ id: s.id, name: s.name, color: s.color, start: s.start, len: s.len })), channels: A.proj.channels.length }),
    // what a clip shows on the host timeline: [step, row, velocity] for its first `max` steps
    hits: (src, max) => {
      const out = [], rows = A.proj.channels.map((c) => c.id), L = src === 'song' ? M.songLen(A.proj) : (M.pat(A.proj, src) || { len: 16 }).len;
      const sl = ENG.clipSlicer(A.proj, { src });
      for (let k = 0; k < Math.min(L, max || 512); k++) for (const { pat, ps } of sl(k)) rows.forEach((id, r) => { const c = M.cell(pat, id, ps); if (c) out.push([k, r, c.v]); });
      return { len: L, rows: rows.length, hits: out };
    },
    stopPreview: () => { if (A.eng.playing) A.stop(); },
    name: () => A.proj.name,
    dispose: () => { A.eng.stop(true); try { A.eng.graph.mVol.disconnect(); } catch (e) { /* gone */ } },
  };
  if (HOST.ready) HOST.ready(api);
};
const startApp = () => A.boot().catch(A.bootFail);
if (document.readyState === 'loading') addEventListener('DOMContentLoaded', startApp); else startApp();
</script>
